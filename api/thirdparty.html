
<!DOCTYPE html>
<html>
<head>
    <title>Third Party API</title>
</head>
<body>

    <h2>Third Party API Explorer</h2>

    <input type="text" id="search" placeholder="Enter a word">
    <button onclick="searchData()">Search</button>

    <p id="message"></p>
    <div id="result"></div>

    <script>
        async function searchData() {

            let word = document.getElementById("search").value.trim();
            let message = document.getElementById("message");
            let result = document.getElementById("result");

            result.innerHTML = "";

            if (!word) {
                message.textContent = "Please enter a word";
                return;
            }

            message.textContent = "Loading...";

            try {
                let response = await fetch(
                    "https://api.dictionaryapi.dev/api/v2/entries/en/" +
                    encodeURIComponent(word)
                );

                if (!response.ok) {
                    throw new Error("Word not found");
                }

                let data = await response.json();

                message.textContent = "Data fetched successfully!";

                result.innerHTML = `
                    <h3>${data[0].word}</h3>
                    <p>Meaning: ${
                        data[0].meanings[0].definitions[0].definition
                    }</p>
                    <p>Part of Speech: ${data[0].meanings[0].partOfSpeech}</p>
                `;

            } catch (error) {
                message.textContent = "Word not found or connection failed";
            }
        }
    </script>

</body>
</html>
